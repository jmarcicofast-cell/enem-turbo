<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENEM Turbo · Administração</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#EEF2FF;--card:#fff;--ink:#1B1A2E;--muted:#5B5A78;--ok:#1FB892;--bad:#FF6B5A;--hum:#FFB800;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14132A;--card:#211F3E;--ink:#F3F2FF;--muted:#B3B1D6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.9rem}
input{font:inherit;font-size:16px;padding:11px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:800;padding:12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--hum);color:#1B1A2E;cursor:pointer}
.msg{font-weight:800;margin:0}.ok{color:var(--ok)}.no{color:var(--bad)}
a{color:inherit}
</style>
</head>
<body>
<main>
  <h1 style="margin:0">Administração</h1>
  <p style="margin:0;color:var(--muted)">Libere o Pro de cortesia para alguém (por exemplo, suas irmãs). A pessoa precisa ter criado a conta no app antes.</p>
  <div class="card" id="who">Carregando…</div>
  <form class="card" id="f" hidden>
    <label for="em">E-mail da conta<input id="em" type="email" required placeholder="irma@email.com"></label>
    <label for="dias">Dias de Pro<input id="dias" type="number" min="1" max="3650" value="365"></label>
    <button type="submit" id="go">Liberar Pro</button>
    <p class="msg" id="msg"></p>
  </form>
  <p style="margin:0"><a href="./">← Voltar para o app</a></p>
</main>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const fn = firebase.app().functions('southamerica-east1');
firebase.auth().onAuthStateChanged(u => {
  const w = document.getElementById('who');
  if (!u) { w.innerHTML = 'Você não está logada. <a href="./">Entre no app</a> com o seu e-mail de administradora e volte aqui.'; return }
  w.textContent = 'Logada como ' + u.email + '. Só funciona se este e-mail estiver em ADMIN_EMAILS no servidor.';
  document.getElementById('f').hidden = false;
});
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const m = document.getElementById('msg'), b = document.getElementById('go');
  b.disabled = true; m.className = 'msg'; m.textContent = 'Liberando…';
  try {
    const r = await fn.httpsCallable('concederPro')({ email: document.getElementById('em').value.trim(), dias: +document.getElementById('dias').value });
    m.className = 'msg ok'; m.textContent = `Pronto! ${r.data.nome} ganhou ${r.data.dias} dias de Pro.`;
  } catch (err) { m.className = 'msg no'; m.textContent = err.message || 'Não deu certo.' }
  b.disabled = false;
};
</script>
</body>
</html>
